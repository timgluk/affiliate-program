services:
  db:
    image: mysql
    restart: always
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - "./db/data:/var/lib/mysql/data"

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"